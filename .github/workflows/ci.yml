name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test with Maven
        run: ./mvnw clean package

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t devops-demo:1.0 .

      - name: Import image into containerd
        run: |
          docker save devops-demo:1.0 -o /tmp/devops-demo.tar
          sudo ctr -n k8s.io images import /tmp/devops-demo.tar

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/
          kubectl rollout restart deployment/devops-demo
          kubectl rollout status deployment/devops-demo
